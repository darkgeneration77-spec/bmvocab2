<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T01 | BM Vocabulary Visual Hub</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff7ef}
#app{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="app" src="home.html" title="T01 BM Vocabulary Visual Hub"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)return;
    const items=[...d.querySelectorAll('.upgrade-item')];
    const cn=[
      ['扛着物品','承担责任'],
      ['抬起箱子','提升尊严／地位'],
      ['拉绳子','吸引注意／兴趣'],
      ['推开物体','拒绝建议'],
      ['伸手够到书','达成目标'],
      ['取得某物','取得成功'],
      ['争抢物品','把握／争取机会'],
      ['抱着婴儿','支持／拥护某项努力'],
      ['牵着弟弟的手','领导组织／国家'],
      ['支撑树枝','支持建议'],
      ['盛装水','承担费用'],
      ['挡住门','抑制／忍住情绪'],
      ['移开物体','转移注意力'],
      ['握住物体','掌握成功']
    ];
    items.forEach((el,i)=>{
      if(!cn[i]||el.querySelector('.cn-line'))return;
      const line=d.createElement('div');
      line.className='cn-line';
      line.innerHTML='<span>'+cn[i][0]+'</span><b> → </b><strong>'+cn[i][1]+'</strong>';
      el.appendChild(line);
    });
    const style=d.createElement('style');
    style.textContent=`.cn-line{margin-top:7px;padding-top:7px;border-top:1px dashed #3d3d3d;color:#d6d6d6;font-size:13px}.cn-line b{color:#777;padding:0 5px}.cn-line strong{color:#ffd54b}.visual-card summary{user-select:none}.visual-card[open] summary{border-bottom:1px solid #eee2d8}`;
    d.head.appendChild(style);
  }catch(e){console.warn(e)}
});
</script>
</body>
</html>
